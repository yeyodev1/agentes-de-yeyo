name: Desplegar Worker

on:
  push:
    branches: [main]
    paths: ["worker/**"]
  workflow_dispatch:

jobs:
  desplegar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Migraciones de D1
        working-directory: worker
        run: npx wrangler d1 migrations apply cerebro-yeyo --remote
      - name: Deploy
        working-directory: worker
        run: npx wrangler deploy
