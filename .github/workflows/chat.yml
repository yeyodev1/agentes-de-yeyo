name: Chat

on:
  workflow_dispatch:

# Uno a la vez: cada ejecución contesta todos los mensajes pendientes en D1.
concurrency:
  group: chat
  cancel-in-progress: false

permissions:
  actions: write # para lanzar a los otros agentes desde el chat
  contents: read

jobs:
  responder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AGENTES_URL: ${{ vars.AGENTES_URL }}
      AGENTES_SECRET: ${{ secrets.AGENTES_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
      LINKEDIN_TOKEN_EXPIRA: ${{ secrets.LINKEDIN_TOKEN_EXPIRA }}
      X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
      X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # El chat prioriza velocidad; los posts los sigue escribiendo Opus.
      CLAUDE_MODEL: claude-sonnet-5-5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # node_modules guardado entre ejecuciones: evita ~8 s de npm ci en cada disparo.
      - id: modulos
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modulos-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.modulos.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run chat
