name: LinkedIn

on:
  schedule:
    # El disparo principal lo hace el Worker a las 8:30. Este es el respaldo (10:00 am
    # Ecuador); el candado del agente evita un segundo post el mismo día.
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo redactar, sin publicar"
        type: boolean
        default: false
      forzar:
        description: "Publicar aunque se haya llegado al tope del día"
        type: boolean
        default: false

concurrency:
  group: linkedin
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AGENTES_URL: ${{ vars.AGENTES_URL }}
      AGENTES_SECRET: ${{ secrets.AGENTES_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
      LINKEDIN_TOKEN_EXPIRA: ${{ secrets.LINKEDIN_TOKEN_EXPIRA }}
      X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
      X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      FORZAR: ${{ inputs.forzar && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # node_modules guardado entre ejecuciones: evita ~8 s de npm ci en cada disparo.
      - id: modulos
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modulos-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.modulos.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run linkedin
